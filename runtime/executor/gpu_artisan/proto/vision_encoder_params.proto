syntax = "proto3";

package odml.infra.proto;

option java_package = "com.google.odml.infra.proto";
option java_outer_classname = "VisionEncoderParametersProto";

// Parameters used for vision encoder for Large Language Models (LLM).
message VisionEncoderParameters {
  // The number of vision tokens.
  int32 tokens_num = 1;

  // Whether to append End of Image (EOI) embedding to the end of vision tokens.
  bool append_eoi_embedding = 2;
}
