syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "Text2SpeechModelTypeOuterClass";

// Kokoro-82M: phoneme-conditioned acoustic predictor + iSTFT neural vocoder.
message Kokoro {
  optional string voice_name = 1;
  optional string language = 2;
  optional int32 target_bucket = 3;
  optional string vocoder_backend = 4;
}

// Qwen3-TTS: autoregressive talker + MTP drafter + RVQ codec vocoder.
message Qwen3Tts {
  optional string language = 1;
  optional string speaker_file = 2;
  optional int32 max_frames = 3;
  // Seed of the codebook-0 sampler. Each session restarts from this seed.
  optional uint64 seed = 4;
  // Whether to sample codebook 0 (true) or pick it greedily (false).
  optional bool do_sample = 5;
  // Softmax temperature of the codebook-0 sampler.
  optional float temperature = 6;
  // Number of most likely codebook-0 tokens to sample from (0 = all).
  optional int32 top_k = 7;
  // Penalty applied to codebook-0 tokens that were already generated.
  optional float repetition_penalty = 8;
}

// Architecture-specific parameters for TTS models.
message Text2SpeechModelType {
  oneof model_type {
    Kokoro kokoro = 1;
    Qwen3Tts qwen3_tts = 2;
  }
}
