syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "AsrModelTypeOuterClass";

// Whisper ASR model.
message Whisper {}

// Parakeet ASR model.
message Parakeet {}

// Moonshine ASR model.
message Moonshine {}

// Qwen3 ASR model.
message Qwen3Asr {}

message AsrModelType {
  oneof model_type {
    Whisper whisper = 1;
    Parakeet parakeet = 2;
    Moonshine moonshine = 3;
    Qwen3Asr qwen3_asr = 4;
  }
  reserved 5;
}
