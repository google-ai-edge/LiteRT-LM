syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "Any2AnySessionConfigOuterClass";

// Per-session configuration for Any-to-Any (omni-modal) conversational
// sessions.
//
// Use `Speech2TextSessionConfig`, `Text2SpeechSessionConfig`, or
// `Text2ImageSessionConfig` for single-task pipelines with fixed input/output
// modalities and task-specific streaming stages (e.g., ASR chunk overlap and
// text merging, TTS text chunking, or diffusion denoising steps). Use
// `Any2AnySessionConfig` for unified omni-modal models (such as MiniCPM-o 2.6)
// where a single multi-turn conversational session accepts interleaved
// multimodal inputs (text, audio, image/video) into a shared autoregressive
// LLM backbone and produces text plus optional synthesized speech.
message Any2AnySessionConfig {
  // Whether to synthesize speech output in addition to text.
  optional bool generate_audio = 1;
  // Optional speaker or voice identifier.
  optional string voice = 2;
  // Optional language hint in BCP-47 format (e.g., "en-US", "zh-CN").
  optional string language = 3;
  // Maximum number of LLM tokens to generate per turn.
  optional int32 max_new_tokens = 4;
  // Maximum number of TTS audio frames to generate per turn.
  optional int32 max_tts_tokens = 5;
  // Optional LLM sampling temperature.
  optional float temperature = 6;
  // Optional LLM top-p nucleus sampling threshold.
  optional float top_p = 7;
  // Optional LLM top-k sampling limit.
  optional int32 top_k = 8;
  // Optional TTS sampling temperature.
  optional float tts_temperature = 9;
  // Optional TTS top-p nucleus sampling threshold.
  optional float tts_top_p = 10;
  // Optional TTS top-k sampling limit.
  optional int32 tts_top_k = 11;
  // Optional system prompt override.
  optional string system_prompt = 12;
}
