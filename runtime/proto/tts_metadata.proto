syntax = "proto3";

package litert.lm.proto;

import "runtime/proto/tts_model_type.proto";

option java_multiple_files = true;
option java_outer_classname = "TtsMetadataOuterClass";

// Parameters for Text-to-Speech (TTS) models.
message TtsMetadata {
  enum TfLiteModelType {
    // Placeholder for unspecified model type.
    TF_LITE_MODEL_TYPE_UNSPECIFIED = 0;
    // The acoustic model converting phonemes to hidden states.
    TF_LITE_ACOUSTIC = 1;
    // The vocoder model converting hidden states to audio.
    TF_LITE_VOCODER = 2;
  }

  // TTS model type.
  TtsModelType tts_model_type = 1;
  // Output audio sample rate in Hz.
  int32 output_sample_rate = 2;
  // Supported languages list in BCP-47 format (e.g., "en-US", "fr-FR", "hi-IN"
  // etc.).
  repeated string supported_languages = 3;
}
