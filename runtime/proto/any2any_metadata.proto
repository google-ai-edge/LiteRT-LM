syntax = "proto3";

package litert.lm.proto;

import "runtime/proto/any2any_model_type.proto";

option java_multiple_files = true;
option java_outer_classname = "Any2AnyMetadataOuterClass";

// Model-specific parameters for Any-to-Any (omni-modal) models.
//
// Unlike single-task capabilities (`Speech2TextMetadata`,
// `Text2SpeechMetadata`, `Text2ImageMetadata`) that configure fixed
// single-input, single-output pipelines, `Any2AnyMetadata` describes unified
// omni-modal conversational models (such as MiniCPM-o 2.6) where a single
// multi-turn session accepts interleaved multimodal inputs (text, audio,
// image/video) into a shared autoregressive multimodal LLM backbone and
// optionally generates synthesized speech from that backbone's hidden states.
message Any2AnyMetadata {
  enum TfLiteModelType {
    // Placeholder for unspecified model type.
    TF_LITE_MODEL_TYPE_UNSPECIFIED = 0;

    // -------------------------------------------------------------------------
    // Input Modality Encoders & Token Embedders (1..99)
    // -------------------------------------------------------------------------
    // Text token embedder lookup table.
    TF_LITE_TEXT_EMBEDDER = 1;
    // Vision encoder backbone (or fused vision encoder + resampler, e.g.,
    // SigLIP + Resampler in MiniCPM-o 2.6).
    TF_LITE_VISION_ENCODER = 10;
    // Audio encoder backbone (or fused audio encoder + projector, e.g.,
    // Whisper + AvgPool1d in MiniCPM-o 2.6).
    TF_LITE_AUDIO_ENCODER = 20;

    // -------------------------------------------------------------------------
    // Multimodal LLM Backbone (100..199)
    // -------------------------------------------------------------------------
    // Multimodal LLM prefill/decode backbone (e.g., Qwen2-7B in MiniCPM-o 2.6).
    TF_LITE_LLM_BACKBONE = 100;

    // -------------------------------------------------------------------------
    // Speech / Audio Generation (TTS / Vocoder) (200..299)
    // -------------------------------------------------------------------------
    // Speech / TTS conditioning projector mapping LLM hidden states into
    // speech decoder space (e.g., 3584 -> 768 MLP in MiniCPM-o 2.6).
    TF_LITE_TTS_PROJECTOR = 200;
    // Autoregressive speech / TTS acoustic token decoder (e.g.,
    // ConditionalChatTTS in MiniCPM-o 2.6).
    TF_LITE_TTS_DECODER = 201;
    // Audio codec decoder / vocoder converting discrete audio codes or mel
    // frames to waveform (e.g., DVAE + Vocos 24 kHz in MiniCPM-o 2.6).
    TF_LITE_AUDIO_VOCODER = 202;
  }

  // Any2Any model architecture type and parameters.
  Any2AnyModelType any2any_model_type = 1;
  // Input audio sample rate in Hz (e.g., 16000).
  optional int32 input_sample_rate_hz = 2;
  // Output audio sample rate in Hz (e.g., 24000).
  optional int32 output_sample_rate_hz = 3;
  // Optional default system prompt.
  optional string system_prompt = 4;
  // Supported languages list in BCP-47 format (e.g., "en-US", "zh-CN").
  repeated string supported_languages = 5;
}
