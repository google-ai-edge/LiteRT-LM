syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "TtsSessionConfigOuterClass";

// Text chunking configuration for streaming TTS sessions.
message TtsTextChunkConfig {
  repeated string delimiters = 1;
  optional bool include_delimiter = 2;
  optional int32 max_buffer_size = 3;
}

// Per-session configuration for Text-to-Speech (TTS) sessions.
message TtsSessionConfig {
  // Language in BCP-47 format (e.g., "en-US").
  optional string language = 1;
  // Speaker or voice identifier (e.g., "af_heart").
  optional string voice = 2;
  // Optional streaming text chunking configuration.
  optional TtsTextChunkConfig text_chunk_config = 3;
}
