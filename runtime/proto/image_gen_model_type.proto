syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "ImageGenModelTypeOuterClass";

// Shared FLUX.2 configuration parameters.
message Flux2Params {
  optional int32 seq_len = 1;
  optional int32 img_size = 2;
  optional int32 packed_ch = 3;
  optional int32 prompt_dim = 4;
  optional int32 default_steps = 5;
  repeated float latent_bn_scale = 6;
  repeated float latent_bn_shift = 7;
}

// Bonsai-FLUX.2: 3-graph monolithic FLUX.2-klein-4B (text encoder, DiT, VAE).
message BonsaiFlux2 {
  Flux2Params flux2_params = 1;
}

// FLUX.2-klein-4B-LiteRT: 11-graph sharded mobile GPU layout.
message Flux2Klein {
  Flux2Params flux2_params = 1;
  // Key of the GenericBinaryData section holding qwen_embed_fp16.bin.
  optional string text_embed_table_key = 2;
}

// Architecture-specific parameters for image generation models.
message ImageGenModelType {
  oneof model_type {
    BonsaiFlux2 bonsai_flux2 = 1;
    Flux2Klein flux2_klein = 2;
  }
}
