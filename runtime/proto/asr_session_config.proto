syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "AsrSessionConfigOuterClass";

// Per-session configuration for Automatic Speech Recognition (ASR) sessions.
message AsrSessionConfig {
  enum TextMergerType {
    TEXT_MERGER_TYPE_UNSPECIFIED = 0;
    TEXT_MERGER_TYPE_LEVENSHTEIN = 1;
    TEXT_MERGER_TYPE_TIMESTAMP = 2;
  }

  // Ratio of overlap between consecutive audio windows in [0.0, 1.0).
  optional float overlap_ratio = 1;

  // Text merger implementation type across overlapping audio windows.
  optional TextMergerType text_merger_type = 2;

  // Optional language hint in BCP-47 format (e.g., "en-US").
  optional string language = 3;
}
