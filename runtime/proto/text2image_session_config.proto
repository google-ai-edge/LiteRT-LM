syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;
option java_outer_classname = "Text2ImageSessionConfigOuterClass";

// Per-session configuration for text-to-image generation sessions.
message Text2ImageSessionConfig {
  // Output image width in pixels.
  optional int32 width = 1;
  // Output image height in pixels.
  optional int32 height = 2;
  // Number of denoising inference steps.
  optional int32 num_inference_steps = 3;
  // Random seed for latent initialization.
  optional int64 seed = 4;
}
