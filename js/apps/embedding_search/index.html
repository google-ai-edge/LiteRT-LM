<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteRT-LM EmbeddingGemma Multimodal Search</title>
  <link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='180 100 700 880' fill='%2300c99e'%3E%3Cpath d='M836.8,358.7c-1-1.1-20.2-20.2-21.2-21.2L197,962.3l580.3-328.2c105.3-59.6,143.1-187.9,59.5-275.3h0Z'/%3E%3Cpath d='M698.9,228.6c-.8-.8-15-15.1-15.8-15.8l-460.7,465.4,432.2-244.5c78.4-44.4,106.6-139.9,44.3-205.1h0Z'/%3E%3Cpath d='M598.8,128.5c-.5-.5-10-10-10.5-10.5l-306,309.1,287-162.4c52.1-29.5,70.8-92.9,29.5-136.2h0Z'/%3E%3C/svg%3E">
  <!--
    Material Symbols, subset to the icons the app uses (keep icon_names
    sorted and in sync with <span class="icon">NAME</span> usages).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&icon_names=add,arrow_back,auto_awesome,check_circle,close,create_new_folder,description,download,expand_more,folder,image,inventory_2,lock,lock_open,mic,music_note,photo_camera,photo_library,search,search_off,stop,upload_file&display=block">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #151d30;
      --bg-card-hover: #1e293b;
      --bg-panel: #0e1424;
      --bg-input: #070a12;
      --border: #24324f;
      --border-light: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --teal: #00c99e;
      --teal-dark: #0b705d;
      --cyan: #5be3e3;
      --blue: #3b82f6;
      --blue-dark: #1d4ed8;
      --purple: #a855f7;
      --pink: #ec4899;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: "Google Sans", "Google Sans Text", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <embedding-search-app></embedding-search-app>
  <script type="module" src="/src/index.ts"></script>
  <script>
    // Register the PWA service worker for offline shell caching.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', {scope: './'})
            .then((reg) => console.log('[PWA] Service Worker registered on scope:', reg.scope))
            .catch((err) => console.error('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
