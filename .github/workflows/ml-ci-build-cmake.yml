name: "ML-CI-Linux-CMake"
on:
  push:
    tags:
      - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch:  # Manual trigger
    inputs:
      MyHaltForConnectionInput:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/check-pr-state.yml

  presubmit:
    needs: gate
    if: needs.gate.outputs.should_skip != 'true'
    name: "Presubmit-Linux-CMake"
    runs-on: "linux-x86-c4-16"
    container:
      image: ubuntu:24.04@sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4
    permissions:
      id-token: write
      actions: write
      contents: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
      SCCACHE_GCS_BUCKET: litert-lm-bazel-cache-us-central1
      SCCACHE_GCS_KEY_PREFIX: sccache
      SCCACHE_GCS_RW_MODE: READ_WRITE
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
      MODEL_KEY: gemma-4-E2B-it.litertlm
      MODEL_PATH: ./models/gemma4
      GCS_MODEL_URL: gs://litert-lm-cicd/models/gemma4/gemma-4-E2B-it.litertlm
      HF_MODEL_URL: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
      GH_TOKEN: ${{ github.token }}  # For gh release upload.

    steps:
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
          apt-get update && apt-get install -yq \
            build-essential gcc clang cmake make gdb pkg-config \
            openjdk-17-jdk-headless git wget curl unzip \
            tar python3 python3-dev python3-pip git-lfs \
            python3-numpy ccache zlib1g-dev libssl-dev \
            libpng-dev libcurl4-openssl-dev libfftw3-dev \
            golang-go npm patchelf \
            apt-file && apt-file update
          git lfs install

      - name: Install sccache
        run: |
          SCCACHE_VERSION="0.10.0"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache"
          chmod +x /usr/local/bin/sccache
          sccache --version

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install pytest
        run: python3 -m pip install --break-system-packages pytest==8.3.4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Download Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$MODEL_PATH"

          echo "Attempting to download from GCS..."
          if ! gcloud storage cp "$GCS_MODEL_URL" "$MODEL_PATH/$MODEL_KEY"; then
            echo "Model not found in GCS. Falling back to Hugging Face..."

            if [ -z "$HF_TOKEN" ]; then
              echo "Error: HF_TOKEN is missing or empty. Failing workflow."
              exit 1
            fi

            echo "Downloading model from Hugging Face..."
            curl --http1.1 -L -C - --retry 5 --retry-delay 3 --retry-all-errors -f \
              --oauth2-bearer "$HF_TOKEN" \
              -o "$MODEL_PATH/$MODEL_KEY" \
              "$HF_MODEL_URL"

            echo "Uploading the downloaded model to GCS for future runs..."
            gcloud storage cp "$MODEL_PATH/$MODEL_KEY" "$GCS_MODEL_URL"
          fi

      - name: Wait For MyRemoteConnection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.MyHaltForConnectionInput }}

      - name: Configure CMake
        run: |
          cmake --preset default

      - name: Build
        run: cmake --build cmake/build/default -j16

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run pytest
        run: pytest tools/pytest/ --build-name=default --backend=cpu --model-path=./models/gemma4/gemma-4-E2B-it.litertlm --build-system=cmake
