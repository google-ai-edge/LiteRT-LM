name: "ML-CI-Linux"
on:
  push:
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  schedule:
    - cron: "0 10 * * *"  # Run at 2am PST (10am UTC) every day to refresh the cache.
  workflow_dispatch:  # Manual trigger
    inputs:
      REFRESH_CACHE:
        description: 'Refresh cache to remove unused files'
        type: boolean
        default: true
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  presubmit:
    name: "Presubmit-Linux"
    runs-on: "linux-x86-c4-16"
    container:
      image: ubuntu:24.04
    permissions:
      id-token: write     # Required to get the OIDC token for WIF
      actions: write  # For gh cache delete.
      contents: write  # For gh release upload.
    env:
      MODEL_KEY: gemma-4-E2B-it.litertlm
      MODEL_PATH: ./models/gemma4
      GCS_MODEL_URL: gs://litert-lm-cicd/models/gemma4/gemma-4-E2B-it.litertlm
      HF_MODEL_URL: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
      GH_TOKEN: ${{ github.token }}  # For gh release upload.
      REFRESH_CACHE: ${{ github.event_name == 'schedule' ||
                         (github.event_name == 'workflow_dispatch' && inputs.REFRESH_CACHE) }}

    steps:
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
          apt-get update && apt-get install -yq \
            build-essential gcc clang cmake make gdb pkg-config \
            openjdk-17-jdk-headless git wget curl unzip \
            tar python3 python3-dev python3-pip git-lfs \
            python3-numpy ccache zlib1g-dev libssl-dev \
            libpng-dev libcurl4-openssl-dev libfftw3-dev \
            golang-go npm patchelf \
            apt-file && apt-file update
          git lfs install

      - name: Install pytest
        run: python3 -m pip install --break-system-packages pytest==8.3.4

      - name: Checkout code.
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          lfs: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@98ddc00a17442e89a24bbf282954a3b65ce6d200 # v2.1.0

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Bazelisk
        run: |
          npm install -g @bazel/bazelisk


      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools

          # Download the official Android headless command-line tools
          wget -qO cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip

          # Cast a wider net: Install both API 33 and 34 to satisfy whatever version Bazel requires
          # Turn off pipefail temporarily so the SIGPIPE on 'yes' doesn't crash the step
          set +o pipefail

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" "platforms;android-34" \
            "build-tools;33.0.1" "build-tools;34.0.0" > /dev/null

          # Turn pipefail back on to keep the rest of your script safe
          set -o pipefail

          # Inject BOTH standard variable names (some rules_android versions are pedantic)
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Export NDK Home globally
        # This guarantees Bazel finds it during both the Linux //... eval and the actual Android compile
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV


      - name : Set up cache keys
        id: cache-keys
        env:
          GH_WORKFLOW: ${{ github.workflow }}
          HASH_WORKSPACE: ${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}
          HASH_BUILD: ${{ hashFiles('**/BUILD*') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          CACHE_RESTORE_KEY_2="$GH_WORKFLOW"
          CACHE_RESTORE_KEY_1="$CACHE_RESTORE_KEY_2-$HASH_WORKSPACE"
          CACHE_RESTORE_KEY_0="$CACHE_RESTORE_KEY_1-$HASH_BUILD"
          CACHE_RESTORE_KEY_HEAD="$CACHE_RESTORE_KEY_0-$BASE_SHA"

          CACHE_KEY="$CACHE_RESTORE_KEY_0-$HEAD_SHA"
          echo "CACHE_RESTORE_KEY_2=$CACHE_RESTORE_KEY_2" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=$CACHE_RESTORE_KEY_1" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=$CACHE_RESTORE_KEY_0" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_HEAD=$CACHE_RESTORE_KEY_HEAD" >> "$GITHUB_OUTPUT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Clean build outputs if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        run: bazelisk clean --expunge

      - name: Restore bazel cache if cache is not being refreshed.
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        env:
          KEY: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          KEY_HEAD: ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_HEAD }}
          KEY_0: ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}
          KEY_1: ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}
          KEY_2: ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}
        run: |
          TARGET_DIR="$HOME/.cache/bazel"
          BUCKET_URL="gs://litert-lm-cicd/caches/linux/bazel"

          echo "cache-primary-key=$KEY" >> "$GITHUB_OUTPUT"

          CACHE_KEYS=("$KEY" \
                      "$KEY_HEAD" \
                      "$KEY_0" \
                      "$KEY_1" \
                      "$KEY_2")

          FOUND_BLOB=""

          GCLOUD_OUTPUT=$(gcloud storage ls "${BUCKET_URL}")

          for key in "${CACHE_KEYS[@]}"; do
              SEARCH_PATH="${BUCKET_URL}/${key}"
              echo "Checking for cache key: ${SEARCH_PATH}"

              # Added '|| true' so a grep miss doesn't crash the GitHub Actions step
              MATCH=$(echo "${GCLOUD_OUTPUT}" | grep -F "${SEARCH_PATH}" | head -n 1 || true)

              if [ -n "$MATCH" ]; then
                  echo "Found matching cache file: ${MATCH}"
                  # MATCH already contains the full gs:// path, so just assign it directly!
                  FOUND_BLOB="${MATCH}"
                  break
              else
                  echo "Key Miss: ${SEARCH_PATH}"
              fi
          done

          if [ ! -z "$FOUND_BLOB" ]; then
            echo "Cache hit! Found blob: $FOUND_BLOB"

            # Parse the clean key name out of the full GCS blob path for logging
            MATCHED_KEY=$(basename "$FOUND_BLOB" .tar.gz)
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            echo "cache-matched-key=$MATCHED_KEY" >> "$GITHUB_OUTPUT"

            echo "Downloading cache archive..."
            # FOUND_BLOB now contains the full gs:// path, so use it directly
            gcloud storage cp "$FOUND_BLOB" ./cache.tar.gz

            if [ -f ./cache.tar.gz ]; then
              echo "Extracting artifacts to $TARGET_DIR..."
              mkdir -p "$TARGET_DIR"
              tar -xzf ./cache.tar.gz -C "$TARGET_DIR"
              rm -f ./cache.tar.gz
            fi
          else
            echo "No matching cache found in GCS. Proceeding with clean build."
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
            echo "cache-matched-key=" >> "$GITHUB_OUTPUT"
          fi


      - name: Download Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$MODEL_PATH"

          echo "Attempting to download from GCS..."
          if ! gcloud storage cp "$GCS_MODEL_URL" "$MODEL_PATH/$MODEL_KEY"; then
            echo "Model not found in GCS. Falling back to Hugging Face..."

            if [ -z "$HF_TOKEN" ]; then
              echo "Error: HF_TOKEN is missing or empty. Failing workflow."
              exit 1
            fi

            echo "Downloading model from Hugging Face..."
            curl --http1.1 -L -C - --retry 5 --retry-delay 3 --retry-all-errors -f \
              --oauth2-bearer "$HF_TOKEN" \
              -o "$MODEL_PATH/$MODEL_KEY" \
              "$HF_MODEL_URL"

            echo "Uploading the downloaded model to GCS for future runs..."
            gcloud storage cp "$MODEL_PATH/$MODEL_KEY" "$GCS_MODEL_URL"
          fi

      - name: Run bazel build on Linux.
        run: |
          bazelisk build --disk_cache=~/.cache/bazel --repository_cache=~/.cache/bazel/repo --config=linux_x86_64 \
            --deleted_packages=swift \
            --java_runtime_version=remotejdk_17 \
            //... \
            //runtime/engine:litert_lm_main

      - name: Check if litert_lm_main doesn't link libLiteRt.so.
        # Return exit code 1 if libLiteRt.so is required.
        run: |
          ! readelf -d bazel-bin/runtime/engine/litert_lm_main | grep libLiteRt.so

      - name: Update litert_lm_main prebuilt for Linux if new version tag is pushed.
        if: github.ref_type == 'tag'
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          cp bazel-bin/runtime/engine/litert_lm_main litert_lm_main.linux_x86_64
          gh release upload "$GH_REF_NAME" litert_lm_main.linux_x86_64 --clobber

      - name: Run bazel test on Linux.
        continue-on-error: true  # Ignore errors when test fails.
        run: |
          bazelisk test --disk_cache=~/.cache/bazel --repository_cache=~/.cache/bazel/repo --config=linux_x86_64 \
            --deleted_packages=swift \
            --test_output=errors \
            //runtime/... \
            //schema/... \
            //c/...

      - name: Upload bazel test logs
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: bazel-test-logs-linux
          path: bazel-testlogs/**/test.log

      - name: Run bazel build on Linux with dynamic linking.
        run: |
          bazelisk build --disk_cache=~/.cache/bazel --repository_cache=~/.cache/bazel/repo --config=linux_x86_64 \
            --define=litert_runtime_link_mode=dynamic \
            --define=resolve_symbols_in_exec=false \
            //runtime/engine:litert_lm_main

      - name: Run pytest
        run: pytest tools/pytest/ --backend=cpu --model-path="$MODEL_PATH/$MODEL_KEY" --build-system=bazel


      - name: Check if litert_lm_main has only LiteRt symbols undefined.
        # Return exit code 1 if libLiteRt.so has LiteRt symbols except for LiteRtTopK
        # and some exceptions listed explictly here.
        # TODO b/453859132: Remove OpaqueOptions.
        run: |
          ! readelf -sW bazel-bin/runtime/engine/litert_lm_main \
            | grep " LiteRt" | grep -v " UND LiteRt" | grep -v " LiteRtTopK" \
            | grep -v -e LiteRtIsSameLayout -e LiteRtGetNumLayoutElements \
                      -e "LiteRt.*Logger" -e "LiteRt.*Metric" -e "LiteRt.*OpaqueOptions" \
                      -e "LiteRt.*EnvironmentOptions" -e LiteRtGetLogSeverityName \
                      -e LiteRtCompareApiVersion -e LiteRtGetStatusString \
                      -e LiteRtGetNumModelSignatures -e LiteRtGetModelSignature \
                      -e LiteRtGetSignatureKey -e LiteRtGetSignatureOutputTensor \
                      -e LiteRtGetQuantizationTypeId -e LiteRtGetPerTensorQuantization \
                      -e LiteRtGetTensorBufferRegistry -e LiteRtRegisterTensorBufferHandlers \
                      -e "LiteRtLmGemmaModelConstraintProvider_*" -e TensorBufferRequirements \
                      -e ExternalLiteRtBufferContext

      - name: Remove cache if cache is being refreshed.
        if: env.REFRESH_CACHE == 'true'
        continue-on-error: true  # Ignore errors when cache is not found.
        env:
          CACHE_KEY: ${{ steps.cache-keys.outputs.CACHE_KEY }}
        run: |
          BUCKET_URL="gs://litert-lm-cicd/caches/linux/bazel"
          echo "REFRESH_CACHE is true. Removing existing cache from GCS: $BUCKET_URL/$CACHE_KEY.tar.gz"
          gcloud storage rm "$BUCKET_URL/$CACHE_KEY.tar.gz"

      - name: Save bazel cache if it's new or being refreshed.
        if: env.REFRESH_CACHE == 'true' || steps.bazel-cache.outputs.cache-hit != 'true'
        env:
          CACHE_KEY: ${{ steps.cache-keys.outputs.CACHE_KEY }}
        run: |
          TARGET_DIR="$HOME/.cache/bazel"
          BUCKET_URL="gs://litert-lm-cicd/caches/linux/bazel"
          ARCHIVE_NAME="cache.tar.gz"

          echo "Checking if target cache folder exists: $TARGET_DIR"
          if [ ! -d "$TARGET_DIR" ]; then
              echo "Target cache folder not found. Skipping cache save."
              exit 0
          fi

          echo "Compressing cache artifacts from $TARGET_DIR..."
          tar -czf ./$ARCHIVE_NAME -C "$TARGET_DIR" .

          if [ -f "./$ARCHIVE_NAME" ]; then
              echo "Uploading cache archive to $BUCKET_URL/$CACHE_KEY.tar.gz..."
              gcloud storage cp ./$ARCHIVE_NAME "$BUCKET_URL/$CACHE_KEY.tar.gz"
          fi