name: "ML-CI-Build-Android"
on:
  push:
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch:  # Manual trigger
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/check-pr-state.yml

  presubmit:
    needs: gate
    if: needs.gate.outputs.should_skip != 'true'
    name: "Presubmit-Android"
    runs-on: "linux-x86-c4-16"
    container:
      image: ubuntu:24.04@sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4
    permissions:
      id-token: write     # Required to get the OIDC token for WIF
      actions: write  # For gh cache delete.
      contents: write  # For gh release upload.
    env:
      MODEL_KEY: gemma-4-E2B-it-litert-lm
      MODEL_PATH: ./models/gemma-4-E2B-it-litert-lm.litertlm
      MODEL_URL: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm

      GH_TOKEN: ${{ github.token }}  # For gh release upload.
    steps:
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
          apt-get update && apt-get install -yq \
            build-essential gcc clang cmake make gdb pkg-config \
            openjdk-17-jdk-headless git wget curl unzip \
            tar python3 python3-dev python3-pip git-lfs \
            python3-numpy ccache zlib1g-dev libssl-dev \
            libpng-dev libcurl4-openssl-dev libfftw3-dev \
            golang-go npm patchelf \
            apt-file && apt-file update
          git lfs install

      - name: Checkout code.
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          lfs: true
          persist-credentials: false

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Bazelisk
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install -g @bazel/bazelisk


      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools

          # Download the official Android headless command-line tools
          wget -qO cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip

          # Turn off pipefail temporarily so the SIGPIPE on 'yes' doesn't crash the step
          set +o pipefail

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" > /dev/null

          # Turn pipefail back on to keep the rest of your script safe
          set -o pipefail

          # Inject BOTH standard variable names (some rules_android versions are pedantic)
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV


      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Export NDK Home globally
        # This guarantees Bazel finds it during both the Linux //... eval and the actual Android compile
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Run bazel build for Android.
        run: |
          bazelisk build --config=github_actions_bazel_cache --config=android_x86_64 \
            --deleted_packages=swift \
            //... \
            //runtime/engine:litert_lm_main \
            @litert//litert/vendors/mediatek/dispatch:dispatch_api_so \
            @litert//litert/vendors/qualcomm/dispatch:dispatch_api_so \
            -- \
            -//python/... \
            -//kotlin/java/com/google/ai/edge/litertlm/example/... \
            -//runtime/components/rust/... \
            -//runtime/components/tool_use/rust/...

      - name: Update litert_lm_main prebuilt for Android if new version tag is pushed.
        if: github.ref_type == 'tag'
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          cp bazel-bin/runtime/engine/litert_lm_main litert_lm_main.android_x86_64
          gh release upload "$GH_REF_NAME" litert_lm_main.android_x86_64 --clobber
