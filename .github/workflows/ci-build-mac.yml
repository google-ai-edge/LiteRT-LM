name: "CI-Mac"
on:
  push:
    branches:
    - main
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  schedule:
    - cron: "0 10 * * *"  # Run at 2am PST (10am UTC) every day to refresh the cache.
  workflow_dispatch:  # Manual trigger
    inputs:
      REFRESH_CACHE:
        description: 'Refresh cache to remove unused files'
        type: boolean
        default: true


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Cancel superseded runs on the same PR branch, but never cancel an
  # in-progress cache refresh on main. With cancel-in-progress: false on main,
  # GitHub Actions runs at most 1 refresh at a time and keeps at most 1 pending
  # run in the queue (automatically replacing any older queued run with the
  # latest HEAD commit).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/check-pr-state.yml

  presubmit:
    needs: gate
    if: needs.gate.outputs.should_skip != 'true'
    name: "Presubmit-Mac"
    runs-on: macos-latest
    permissions:
      actions: write  # For gh cache delete.
      contents: write  # For gh release upload.
    env:
      MODEL_KEY: gemma-4-E2B-it-litert-lm
      MODEL_PATH: ./models/gemma-4-E2B-it-litert-lm.litertlm
      MODEL_URL: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm

      GH_TOKEN: ${{ github.token }}  # For gh release upload.
      REFRESH_CACHE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                         github.event_name == 'schedule' ||
                         (github.event_name == 'workflow_dispatch' && inputs.REFRESH_CACHE) }}
    steps:
      - name: Checkout code.
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 100

      - name: Install pytest
        run: python3 -m pip install --break-system-packages pytest==8.3.4

      # Unlike Linux, Android, and Windows CI (which run on self-hosted GKE
      # runners), macOS CI runs on GitHub-hosted runners and uses actions/cache
      # with --disk_cache instead of the GCS remote cache.
      - name: Set up cache keys.
        id: cache-keys
        run: |
          DAILY_PREFIX="${GITHUB_WORKFLOW}-daily-"
          HEAD_PREFIX="${GITHUB_WORKFLOW}-head-"

          # Look up the currently saved main/head cache SHA and check via
          # `git merge-base --is-ancestor` whether the commit being built
          # contains that SHA in its history (even if the main/head cache is a
          # few CLs behind). If not, fall back to the daily cache.
          CACHED_HEAD_KEY=$(gh cache list --key "${HEAD_PREFIX}" --sort created_at --order desc --limit 1 --json key -q '.[0].key' 2>/dev/null || true)
          CACHED_HEAD_SHA="${CACHED_HEAD_KEY#"$HEAD_PREFIX"}"

          PR_COMMIT="${{ github.event.pull_request.head.sha }}"
          if [ -n "$CACHED_HEAD_SHA" ] && git merge-base --is-ancestor "$CACHED_HEAD_SHA" "${PR_COMMIT:-HEAD}" 2>/dev/null; then
            echo "Commit ${PR_COMMIT:-HEAD} contains cached main/head ($CACHED_HEAD_SHA); using main/head cache."
            CACHE_RESTORE_PRIMARY="${CACHED_HEAD_KEY}"
          else
            echo "Commit ${PR_COMMIT:-HEAD} does not contain cached main/head (${CACHED_HEAD_SHA:-none}); falling back to daily cache."
            CACHE_RESTORE_PRIMARY="${DAILY_PREFIX}${{ github.sha }}"
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CACHE_PREFIX_TO_CLEAN="${HEAD_PREFIX}"
            CACHE_SAVE_KEY="${HEAD_PREFIX}${{ github.sha }}"
          else
            CACHE_PREFIX_TO_CLEAN="${DAILY_PREFIX}"
            CACHE_SAVE_KEY="${DAILY_PREFIX}${{ github.sha }}"
          fi

          echo "DAILY_PREFIX=$DAILY_PREFIX" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_PRIMARY=$CACHE_RESTORE_PRIMARY" >> "$GITHUB_OUTPUT"
          echo "CACHE_PREFIX_TO_CLEAN=$CACHE_PREFIX_TO_CLEAN" >> "$GITHUB_OUTPUT"
          echo "CACHE_SAVE_KEY=$CACHE_SAVE_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore bazel cache.
        id: bazel-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/bazel
          key: ${{ steps.cache-keys.outputs.CACHE_RESTORE_PRIMARY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.DAILY_PREFIX }}

      - name: Check cache hit.
        run: |
          echo "Cache Hit: ${STEPS_BAZEL_CACHE_OUTPUTS_CACHE_HIT}"
          echo "Cache Primary Key: ${STEPS_BAZEL_CACHE_OUTPUTS_CACHE_PRIMARY_KEY}"
          echo "Cache Matched Key: ${STEPS_BAZEL_CACHE_OUTPUTS_CACHE_MATCHED_KEY}"
        env:
          STEPS_BAZEL_CACHE_OUTPUTS_CACHE_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          STEPS_BAZEL_CACHE_OUTPUTS_CACHE_PRIMARY_KEY: ${{ steps.bazel-cache.outputs.cache-primary-key }}
          STEPS_BAZEL_CACHE_OUTPUTS_CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}

      - name: Record cache timestamp before build.
        if: env.REFRESH_CACHE == 'true'
        run: touch "${RUNNER_TEMP}/bazel-cache-start"

      - name: Download Model
        if: github.event_name == 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p ./models
          if [ -z "$HF_TOKEN" ]; then
            echo "Warning: HF_TOKEN is empty (unauthenticated external PR or missing secret). Skipping gated model download on macOS..."
            exit 0
          fi
          echo "Downloading model across Hugging Face..."
          curl --http1.1 -L -C - --retry 5 --retry-delay 3 --retry-all-errors -f \
            --oauth2-bearer "$HF_TOKEN" \
            -o ${MODEL_PATH} \
            "${MODEL_URL}"
          ls -lh ${MODEL_PATH}

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH


      - name: Run bazel build on MacOS for release (static linking).
        run: |
          bazel build --disk_cache=~/.cache/bazel \
            --repository_cache=~/.cache/bazel/repo \
            --config=macos_arm64 \
            -c opt \
            //runtime/engine:litert_lm_main

      - name: Check if litert_lm_main does not link libLiteRt.dylib
        run: |
          ! otool -L bazel-bin/runtime/engine/litert_lm_main | grep libLiteRt.dylib

      - name: Update litert_lm_main prebuilt for MacOS if new version tag is pushed.
        if: github.ref_type == 'tag'
        run: |
          mkdir -p litert_lm_macos_arm64
          cp bazel-bin/runtime/engine/litert_lm_main litert_lm_macos_arm64/litert_lm_main
          cp prebuilt/macos_arm64/libGemmaModelConstraintProvider.dylib litert_lm_macos_arm64/
          tar -czvf litert_lm_macos_arm64.tar.gz -C litert_lm_macos_arm64 .

          cp bazel-bin/runtime/engine/litert_lm_main litert_lm_main.macos_arm64
          gh release upload ${GITHUB_REF_NAME} litert_lm_main.macos_arm64 --clobber
          gh release upload ${GITHUB_REF_NAME} prebuilt/macos_arm64/libGemmaModelConstraintProvider.dylib --clobber
          gh release upload ${GITHUB_REF_NAME} litert_lm_macos_arm64.tar.gz --clobber

      - name: Run bazel build on MacOS with dynamic linking.
        run: |
          bazel build --disk_cache=~/.cache/bazel \
            --repository_cache=~/.cache/bazel/repo \
            --config=macos_arm64 \
            -c opt \
            --define=litert_runtime_link_mode=dynamic \
            //runtime/engine:litert_lm_main

      - name: Run bazel test on MacOS.
        run: |
          bazel test --disk_cache=~/.cache/bazel \
            --repository_cache=~/.cache/bazel/repo \
            --config=macos_arm64 \
            -c opt \
            --define=litert_runtime_link_mode=dynamic \
            --test_output=errors \
            //runtime/... \
            //schema/... \
            //c/...

      - name: Run pytest
        if: github.event_name == 'pull_request'
        run: |
          if [ -f "${MODEL_PATH}" ]; then
            pytest tools/pytest/ --backend=cpu --model-path=${MODEL_PATH} --build-system=bazel
          else
            echo "Skipping pytest on macOS because model file ${MODEL_PATH} is not downloaded (unauthenticated PR)."
          fi

      # TODO(totero): Re-enable this step once the bug is fixed.
      # - name: Run bazel build for iOS Simulator.
      #   run: |

      #     bazel build --disk_cache=~/.cache/bazel \
      #       --repository_cache=~/.cache/bazel/repo \
      #       --build_tag_filters=-requires-mac-inputs:hard,-no_mac \
      #       --config=ios_arm64 \
      #       --apple_platform_type=ios \
      #       --cpu=ios_arm64 \
      #       --ios_multi_cpus=arm64 \
      #       -c opt \
      #       --define=litert_link_capi_so=true \
      #       --define=litert_runtime_link_mode=dynamic \
      #       //runtime/engine:litert_lm_main

      # - name: Update litert_lm_main prebuilt for iOS Simulator if new version tag is pushed.
      #   if: github.ref_type == 'tag'
      #   run: |
      #     cp bazel-bin/runtime/engine/litert_lm_main litert_lm_main.ios_sim_arm64
      #     gh release upload ${GITHUB_REF_NAME} litert_lm_main.ios_sim_arm64 --clobber

      - name: Prune unused cache files before saving.
        if: env.REFRESH_CACHE == 'true'
        run: |
          if [ -d ~/.cache/bazel ]; then
            echo "Cache size before pruning:"
            du -sh ~/.cache/bazel
            # Prune unused disk_cache entries (ac/ and cas/ update file mtime on every hit/write).
            find ~/.cache/bazel -path ~/.cache/bazel/repo -prune -o -type f ! -newer "${RUNNER_TEMP}/bazel-cache-start" -delete
            # Prune unused repository_cache entries (DownloadCache touches 'file' on hit; remove the entry directory so 'id-*' is removed with 'file').
            if [ -d ~/.cache/bazel/repo ]; then
              find ~/.cache/bazel/repo -type f -name "file" ! -newer "${RUNNER_TEMP}/bazel-cache-start" | while IFS= read -r unused_file; do
                rm -rf "$(dirname "$unused_file")"
              done
            fi
            find ~/.cache/bazel -type d -empty -delete
            echo "Cache size after pruning:"
            du -sh ~/.cache/bazel
          fi

      - name: Remove previous cache in this slot before saving.
        if: env.REFRESH_CACHE == 'true'
        continue-on-error: true  # Ignore errors when cache is not found.
        run: |
          gh cache list --key "${CACHE_PREFIX_TO_CLEAN}" --json id -q '.[].id' | while IFS= read -r cache_id; do
            if [ -n "$cache_id" ]; then
              gh cache delete "$cache_id"
            fi
          done
        env:
          CACHE_PREFIX_TO_CLEAN: ${{ steps.cache-keys.outputs.CACHE_PREFIX_TO_CLEAN }}

      - name: Save bazel cache if it's new or being refreshed.
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.REFRESH_CACHE == 'true'
        with:
          path: ~/.cache/bazel
          key: ${{ steps.cache-keys.outputs.CACHE_SAVE_KEY }}
