name: 'GCS Cache Action'
description: 'Restores or saves a directory to/from Google Cloud Storage with prefix fallback'

inputs:
  mode:
    description: 'Whether to "restore" or "save"'
    required: true
  target-dir:
    description: 'Local directory to cache/restore'
    required: true
  bucket-url:
    description: 'GCS bucket path for this cache'
    required: true
  cache-key:
    description: 'Unique cache key for this commit'
    required: true
  restore-key:
    description: 'Base fallback restore key'
    required: true
  refresh-cache:
    description: 'Whether to force refresh/clear the cache'
    required: false
    default: 'false'
  target-subdirs:
    description: 'Specific subdirectories to compress (space-separated). Defaults to "." (everything)'
    required: false
    default: '.'

outputs:
  cache-hit:
    description: 'Whether a cache hit occurred'
    value: ${{ steps.restore-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Restore Cache from GCS
      if: inputs.mode == 'restore'
      id: restore-cache
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target-dir }}
        BUCKET_URL: ${{ inputs.bucket-url }}
        CACHE_KEY: ${{ inputs.cache-key }}
        RESTORE_KEY: ${{ inputs.restore-key }}
      run: |
        CACHE_KEYS=(
          "$CACHE_KEY"
          $RESTORE_KEY
        )

        FOUND_BLOB=""
        GCLOUD_OUTPUT=$(gcloud storage ls "${BUCKET_URL}" 2>/dev/null || true)

        for key in "${CACHE_KEYS[@]}"; do
            SEARCH_PATH="${BUCKET_URL}/${key}.tar.gz"
            echo "Checking for cache key: ${SEARCH_PATH}"
            MATCH=$(echo "${GCLOUD_OUTPUT}" | grep -F "${SEARCH_PATH}" | head -n 1 || true)
            if [ -n "$MATCH" ]; then
                echo "Found matching cache file: ${MATCH}"
                FOUND_BLOB="${MATCH}"
                break
            fi
        done

        if [ -n "$FOUND_BLOB" ]; then
          echo "Cache hit! Downloading archive..."
          echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          
          rm -f ./gcs-cache-archive.tar.gz
          gcloud storage cp "$FOUND_BLOB" ./gcs-cache-archive.tar.gz

          if [ -f ./gcs-cache-archive.tar.gz ]; then
            echo "Extracting artifacts to $TARGET_DIR..."
            mkdir -p "$TARGET_DIR"
            tar -xzf ./gcs-cache-archive.tar.gz -C "$TARGET_DIR" || true
            rm -f ./gcs-cache-archive.tar.gz
          fi
        else
          echo "No matching cache found in GCS. Proceeding cold."
          echo "cache-hit=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Cache to GCS
      if: inputs.mode == 'save' && (inputs.refresh-cache == 'true' || env.CACHE_HIT != 'true')
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target-dir }}
        BUCKET_URL: ${{ inputs.bucket-url }}
        CACHE_KEY: ${{ inputs.cache-key }}
        TARGET_SUBDIRS: ${{ inputs.target-subdirs }}
      run: |
        ARCHIVE_NAME="gcs-cache-archive.tar.gz"

        if [ ! -d "$TARGET_DIR" ]; then
            echo "Target cache folder ($TARGET_DIR) not found. Skipping cache save."
            exit 0
        fi

        echo "Compressing cache artifacts from $TARGET_DIR..."
        rm -f ./$ARCHIVE_NAME

        tar -czf ./$ARCHIVE_NAME -C "$TARGET_DIR" $TARGET_SUBDIRS

        if [ -f "./$ARCHIVE_NAME" ]; then
            echo "Uploading cache archive to $BUCKET_URL/$CACHE_KEY.tar.gz..."
            gcloud storage cp ./$ARCHIVE_NAME "$BUCKET_URL/$CACHE_KEY.tar.gz"
            rm -f ./$ARCHIVE_NAME
        fi