# Bazel downloader config, enabled from .bazelrc via --experimental_downloader_config.
#
# android.googlesource.com rate-limits unauthenticated CI runners with HTTP 503, which breaks
# fetching @com_android_dex (the dalvik archive pulled in by rules_android_prereqs()). Try
# Bazel's mirror first, then fall back to the original host.
rewrite (android.googlesource.com)/(.*) mirror.bazel.build/$1/$2
rewrite (android.googlesource.com)/(.*) $1/$2
